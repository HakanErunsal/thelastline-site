<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050608" />
    <meta name="robots" content="noindex" />
    <title>Get The Last Line</title>
    <link rel="canonical" href="https://thelastline.rigbak.com/" />
    <meta property="og:site_name" content="The Last Line" />
    <meta property="og:title" content="The Last Line" />
    <meta property="og:description" content="A mobile zombie survival shooter with massive hordes and arena bosses. Out now on iPhone, iPad and Android." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thelastline.rigbak.com/app" />
    <meta property="og:image" content="https://thelastline.rigbak.com/assets/images/thelastline_horde_arena-d641a3.jpg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="888" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        var APP_STORE_URL = "https://apps.apple.com/app/id6756308513";
        var PLAY_URL = "https://play.google.com/store/apps/details?id=com.rigbak.thelastline";

        var query = new URLSearchParams(window.location.search);
        var referrer = new URLSearchParams();
        query.forEach(function (value, key) {
          if (key.indexOf("utm_") === 0) referrer.append(key, value);
        });
        var playUrl = referrer.toString() ? PLAY_URL + "&referrer=" + encodeURIComponent(referrer.toString()) : PLAY_URL;

        var ua = navigator.userAgent || "";
        // iPadOS 13+ Safari reports a desktop Mac user agent; touch points tell it apart from a real Mac.
        var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var isAndroid = /Android/i.test(ua);

        window.TLL_STORE = { appStore: APP_STORE_URL, play: playUrl };

        if (isIOS) {
          window.location.replace(APP_STORE_URL);
        } else if (isAndroid) {
          window.location.replace(playUrl);
        }
      })();
    </script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: #050608;
        color: #e8e6e1;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px 16px;
        text-align: center;
      }
      main { max-width: 420px; width: 100%; }
      .icon { width: 112px; height: 112px; border-radius: 24px; display: block; margin: 0 auto 20px; }
      h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: 0.02em; }
      p { margin: 0 0 28px; color: #a9a59c; line-height: 1.5; }
      .badges { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }
      .badges a { display: inline-block; }
      .badges img { height: 52px; width: auto; display: block; }
      .home { display: inline-block; margin-top: 28px; color: #a9a59c; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <img class="icon" src="/assets/images/thelastline_app_icon.png" alt="The Last Line app icon" width="112" height="112" />
      <h1>The Last Line</h1>
      <p>Hold the barricade against the horde. Free on iPhone, iPad and Android.</p>
      <div class="badges">
        <a id="appstore" href="https://apps.apple.com/app/id6756308513">
          <img src="/assets/images/appstore-download-badge.svg" alt="Download on the App Store" />
        </a>
        <a id="play" href="https://play.google.com/store/apps/details?id=com.rigbak.thelastline">
          <img src="/assets/images/googleplay-download-badge.png" alt="Get it on Google Play" />
        </a>
      </div>
      <a class="home" href="/">thelastline.rigbak.com</a>
    </main>
    <script>
      if (window.TLL_STORE) document.getElementById("play").href = window.TLL_STORE.play;
    </script>
  </body>
</html>
